<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理后台 · 拾光</title><style>body{font:15px system-ui;background:#f5f5f7;color:#222;margin:0;padding:32px}main{max-width:1000px;margin:auto}section{background:white;border-radius:16px;padding:22px;margin:16px 0}input,textarea,button{font:inherit;padding:10px;border:1px solid #ddd;border-radius:8px;margin:4px}button{background:#1677df;color:white;border:0;cursor:pointer}article{border-top:1px solid #eee;padding:12px 0}small{color:#666}</style><main><h1>拾光管理后台</h1><section id="login"><h2>管理员登录</h2><input id="account" placeholder="管理员账号"><input id="password" type="password" placeholder="密码"><button onclick="signin()">登录</button><p>首次使用：在服务器环境设置 ADMIN_ACCOUNT 与 ADMIN_PASSWORD 后重启。</p></section><div id="app" hidden></div></main><script src="api-config.js"></script><script>let token=localStorage.getItem('admin_token');async function api(path,data){let r=await fetch((window.API_BASE_URL||'')+'/api/admin/'+path,{method:data?'POST':'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:data?JSON.stringify(data):undefined}),j=await r.json();if(!r.ok)throw Error(j.error||'请求失败');return j}async function signin(){try{let r=await fetch((window.API_BASE_URL||'')+'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({account:account.value,password:password.value})}),j=await r.json();if(!r.ok)throw Error(j.error);if(j.user.role!=='admin')throw Error('该账号不是管理员');token=j.token;localStorage.setItem('admin_token',token);await load()}catch(e){alert(e.message)}}async function load(){try{let d=await api('overview');login.hidden=true;app.hidden=false;app.innerHTML=`<section><h2>注册设置</h2><label><input type="checkbox" id="ru" ${d.settings.register_user==='1'?'checked':''}>开放普通用户注册</label><label><input type="checkbox" id="rm" ${d.settings.register_merchant==='1'?'checked':''}>开放商户注册</label><p>Telegram 群组：<input id="tg" value="${d.settings.telegram_source||''}" style="width:60%"></p><button onclick="settings()">保存设置</button></section><section><h2>待审核商品</h2>${d.products.filter(x=>x.status==='pending'||x.status==='revision').map(x=>`<article><b>${x.name}</b> · ${x.price} 积分 <small>${x.source} / ${x.merchant||''}</small><p>${x.desc}</p><button onclick="review(${x.id},'approved')">通过上线</button><button onclick="review(${x.id},'revision')">要求修改</button><button onclick="review(${x.id},'rejected')">拒绝</button></article>`).join('')||'暂无待审核商品'}</section><section><h2>Telegram 群组信息导入</h2><p>当前使用人工粘贴导入；机器人尚未获群组授权，内容均需审核。</p><textarea id="content" rows="4" style="width:95%" placeholder="粘贴群组中的商品信息"></textarea><button onclick="importText()">加入待处理</button>${d.imports.map(x=>`<article>#${x.id} ${x.status} <p>${x.content}</p><button onclick="makeProduct(${x.id})">转为待审核商品</button></article>`).join('')}</section><section><h2>积分充值申请</h2>${d.topups.filter(x=>x.status==='pending').map(x=>`<article>${x.account} 申请 ${x.points} 积分 <button onclick="confirmTopup('${x.id}')">确认到账</button></article>`).join('')||'暂无待处理充值'}</section><section><h2>账号</h2>${d.users.map(x=>`<article>${x.account} · ${x.role} · ${x.balance} 积分</article>`).join('')}</section>`}catch(e){login.hidden=false;app.hidden=true;alert(e.message)}}async function settings(){await api('settings',{register_user:ru.checked?'1':'0',register_merchant:rm.checked?'1':'0',telegram_source:tg.value});load()}async function review(id,status){await api('review',{id,status});load()}async function importText(){await api('imports',{content:content.value});load()}async function makeProduct(id){let name=prompt('商品名称'),description=prompt('商品介绍'),price=prompt('积分价格','0');if(name&&description)await api('imports/product',{id,name,description,price:Number(price)});load()}async function confirmTopup(id){await api('topups/confirm',{id});load()}if(token)load();</script><script src="admin-extra.js"></script></html>
