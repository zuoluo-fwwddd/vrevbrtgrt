<div class="modal" id="modal"><div class="box" id="box"></div></div><div class="toast" id="toast"></div><script src="api-config.js"></script><script>
const products=[{name:'静谧降噪耳机',desc:'沉浸聆听，给思绪一点空间。',price:899,icon:'🎧',color:'#e8e5e0'},{name:'弧光桌面音箱',desc:'让好声音，自然融入房间。',price:1299,icon:'🔊',color:'#dce5e8'},{name:'晨间氛围台灯',desc:'柔和光线，点亮每一个夜晚。',price:499,icon:'💡',color:'#efe4d2'},{name:'随行保温杯',desc:'轻巧耐用，温度一路相伴。',price:229,icon:'☕',color:'#e4e7dd'},{name:'云朵无线键盘',desc:'轻盈敲击，桌面保持从容。',price:599,icon:'⌨️',color:'#e4e1e8'},{name:'折叠阅读支架',desc:'找到舒服角度，专注每一页。',price:159,icon:'📖',color:'#e8e2dc'}];let active=0,mode='login';const grid=document.querySelector('#productGrid'),modal=document.querySelector('#modal'),box=document.querySelector('#box');
grid.innerHTML=products.map((p,i)=>`<article class="card" onclick="openProduct(${i})"><div class="card-info"><h3>${p.name}</h3><p>${p.desc}</p><div class="price-row"><p class="price">RMB ¥${p.price}</p><p class="merchant">商家</p></div><button class="pill" onclick="event.stopPropagation();openProduct(${i})">查看详情</button></div><div class="productart" style="background:radial-gradient(ellipse,#fff 5%,${p.color} 78%)">${p.icon}</div></article>`).join('');
function show(html){box.innerHTML=html;modal.classList.add('open')}function closeModal(){modal.classList.remove('open')}let photoIndex=0,touchStartX=0;const galleryPhotos=['photo-1505740420928-5e560c06d30e','photo-1484704849700-f032a568e944','photo-1546435770-a3e426bf472b','photo-1583394838336-acd977736f90'];function openProduct(i){active=i;photoIndex=0;renderProductGallery()}function renderProductGallery(){const p=products[active],url=id=>`https://images.unsplash.com/${id}?auto=format&fit=crop&w=900&h=650&q=85`;show(`<button class="close" onclick="closeModal()">×</button><div class="detail-layout"><div class="detail-copy"><h2>${p.name}</h2><p>${p.desc} 精选材质与细节设计，为日常带来更轻松的体验。</p><div class="total"><span>示例售价</span><b>¥${p.price}</b></div><button class="pill" onclick="checkout()">立即购买</button><p style="text-align:center;font-size:12px">虚拟商品 · 演示结账</p></div><div><div class="gallery" id="gallery"><button class="gallery-arrow prev" onclick="movePhoto(-1)" aria-label="上一张">‹</button><img id="galleryImage" src="${url(galleryPhotos[photoIndex])}" alt="${p.name} 商品图 ${photoIndex+1}"><button class="gallery-arrow next" onclick="movePhoto(1)" aria-label="下一张">›</button><div class="photo-count">${photoIndex+1} / ${galleryPhotos.length}</div></div><div class="dots">${galleryPhotos.map((_,n)=>`<button class="dot ${n===photoIndex?'selected':''}" onclick="setPhoto(${n})" aria-label="第${n+1}张"></button>`).join('')}</div></div></div>`);const g=document.querySelector('#gallery');g.addEventListener('touchstart',e=>touchStartX=e.changedTouches[0].screenX,{passive:true});g.addEventListener('touchend',e=>{const dx=e.changedTouches[0].screenX-touchStartX;if(Math.abs(dx)>40)movePhoto(dx<0?1:-1)},{passive:true})}function movePhoto(n){photoIndex=(photoIndex+n+galleryPhotos.length)%galleryPhotos.length;renderProductGallery()}function setPhoto(n){photoIndex=n;renderProductGallery()}function checkout(){let p=products[active];show(`<button class="close" onclick="closeModal()">×</button><h2>确认订单</h2><p>${p.name}</p><label>收货人<input id="buyer" placeholder="请输入姓名"></label><label>联系电话<input id="phone" placeholder="请输入手机号"></label><label>收货地址<input id="address" placeholder="省市区及详细地址"></label><div class="total"><span>应付金额</span><b>¥${p.price}</b></div><button class="pill" onclick="pay()">模拟支付 ¥${p.price}</button><p style="text-align:center;font-size:12px">演示支付，不会真实扣款</p>`)}function pay(){if(!document.querySelector('#buyer').value||!document.querySelector('#phone').value||!document.querySelector('#address').value){toast('请填写完整的收货信息');return}show(`<button class="close" onclick="closeModal()">×</button><h2>支付成功 ✓</h2><p>这是模拟支付结果，未产生真实交易。</p><div class="total"><span>${products[active].name}</span><b>¥${products[active].price}</b></div><button class="pill" onclick="closeModal()">完成</button>`)}function auth(which){mode=which;show(`<button class="close" onclick="closeModal()">×</button><h2>${which==='login'?'登录拾光账户':'创建账户'}</h2><p>${which==='login'?'欢迎回来，继续发现喜欢的好物。':'注册后即可查看和管理你的订单。'}</p><label>邮箱或手机号<input id="account" autocomplete="username" placeholder="请输入邮箱或手机号"></label><label>密码<input id="password" type="password" autocomplete="current-password" placeholder="至少 8 位"></label><button class="pill" onclick="authSubmit()">${which==='login'?'登录':'注册'}</button><p style="text-align:center">${which==='login'?'还没有账户？':'已有账户？'} <span class="switch" onclick="auth('${which==='login'?'register':'login'}')">${which==='login'?'立即注册':'返回登录'}</span></p><p style="font-size:11px;text-align:center">账户通过本地后端验证</p>`)}async function authSubmit(){let account=document.querySelector('#account').value,password=document.querySelector('#password').value;try{const r=await fetch((window.API_BASE_URL||'')+(mode==='login'?'/api/login':'/api/register'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({account,password,role:document.querySelector('#role')?.value||'user'})});const d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');if(mode==='login'){authToken=d.token;localStorage.setItem('shiguang_token',authToken)}closeModal();toast(mode==='login'?'登录成功':'注册成功，请登录')}catch(e){toast(e.message)}}function toast(t){let e=document.querySelector('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2300)}document.querySelector('#loginTop').onclick=()=>auth('login');modal.onclick=e=>{if(e.target===modal)closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(modal.classList.contains('open')&&e.key==='ArrowLeft')movePhoto(-1);if(modal.classList.contains('open')&&e.key==='ArrowRight')movePhoto(1)});
</script><script src="api-config.js"></script><script>
window.authSubmit=async function(){const account=document.querySelector('#account')?.value||'',password=document.querySelector('#password')?.value||'';try{const r=await fetch((window.API_BASE_URL||'')+(mode==='login'?'/api/login':'/api/register'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({account,password,role:document.querySelector('#role')?.value||'user'})});const d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');if(mode==='login'){authToken=d.token;localStorage.setItem('shiguang_token',d.token);localStorage.setItem('shiguang_account',d.user.account);closeModal();accountCenter()}else{closeModal();toast('注册成功，请登录')}}catch(e){toast(e.message)}};
window.accountCenter=async function(){if(!authToken){auth('login');return}show(`<button class="close" onclick="closeModal()">×</button><h2>个人资料</h2><p>账号：${localStorage.getItem('shiguang_account')||'已登录'}</p><h3>我的订单</h3><div id="ordersList">正在加载订单…</div><button class="pill" onclick="logout()">退出登录</button>`);try{const r=await fetch((window.API_BASE_URL||'')+'/api/orders',{headers:{'Authorization':'Bearer '+authToken}}),d=await r.json();if(!r.ok)throw Error(d.error||'读取订单失败');document.querySelector('#ordersList').innerHTML=d.length?d.map(o=>`<p>${o.name}　¥${o.amount}　${o.status==='paid'?'已付款':'待付款'}</p>`).join(''):'<p>还没有订单</p>'}catch(e){document.querySelector('#ordersList').textContent=e.message}};
window.logout=async function(){const token=authToken;try{if(token)await fetch((window.API_BASE_URL||'')+'/api/logout',{method:'POST',headers:{Authorization:'Bearer '+token}})}finally{authToken='';localStorage.removeItem('shiguang_token');localStorage.removeItem('shiguang_account');closeModal();toast('已退出登录')}};document.querySelector('#loginTop').onclick=()=>authToken?accountCenter():auth('login');if(authToken)document.querySelector('#loginTop').textContent='我的账户';
</script><script src="store-extra.js"></script></body></html>














<script>
const authBase=window.auth;
window.auth=function(which){authBase(which);if(which==='register'){const target=document.querySelector('#account')?.parentElement;if(target&&!document.querySelector('#role'))target.insertAdjacentHTML('beforebegin','<label>注册身份<select id="role"><option value="user">普通用户</option><option value="merchant">商户</option></select></label>')}};
window.loadApprovedProducts=async function(){try{const r=await fetch((window.API_BASE_URL||'')+'/api/products'),d=await r.json();if(!r.ok)throw Error(d.error||'读取商品失败');if(!d.length)return;products.splice(0,products.length,...d.map(p=>({id:p.id,name:p.name,desc:p.desc,price:p.price,icon:p.icon||'🛍️',color:p.color||'#e8e5e0',image:p.image||'',merchant:p.merchant||''})));grid.innerHTML=products.map((p,i)=>`<article class="card" onclick="openProduct(${i})"><div class="card-info"><h3>${p.name}</h3><p>${p.desc}</p><div class="price-row"><p class="price">${p.price} 积分</p><p class="merchant">${p.merchant||'商户'}</p></div><button class="pill" onclick="event.stopPropagation();openProduct(${i})">查看详情</button></div><div class="productart" style="background:radial-gradient(ellipse,#fff 5%,${p.color} 78%)">${p.image?`<img src="${p.image}" alt="${p.name}" style="width:100%;height:100%;object-fit:cover">`:p.icon}</div></article>`).join('')}catch(e){toast(e.message)}};
window.accountCenter=async function(){if(!authToken){auth('login');return}const h={Authorization:'Bearer '+authToken};try{const [mr,lr]=await Promise.all([fetch((window.API_BASE_URL||'')+'/api/me',{headers:h}),fetch((window.API_BASE_URL||'')+'/api/ledger',{headers:h})]),me=await mr.json(),ledger=await lr.json();if(!mr.ok)throw Error(me.error||'登录已过期');localStorage.setItem('shiguang_account',me.account);const merchant=me.role==='merchant'?'<h3>提交商品</h3><label>商品名称<input id="mpname"></label><label>商品介绍<input id="mpdesc"></label><label>积分价格<input id="mpprice" type="number" min="0"></label><label>商品图片链接<input id="mpimage"></label><button class="pill" onclick="submitMerchantProduct()">提交审核</button><div id="merchantProducts"></div>':'';show(`<button class="close" onclick="closeModal()">×</button><h2>我的账户</h2><p>${me.account} · ${me.role==='merchant'?'商户':'普通用户'}</p><p>当前积分：<b>${me.balance}</b></p><h3>申请充值积分</h3><input id="topupAmount" type="number" min="1" placeholder="积分数量"><button onclick="submitTopup()">提交申请</button>${merchant}<h3>积分明细</h3>${ledger.map(x=>`<p>${x.note||x.kind}　${x.delta>0?'+':''}${x.delta}　${x.created_at}</p>`).join('')||'<p>暂无记录</p>'}<h3>我的订单</h3><div id="myOrders">加载中…</div><button class="pill" onclick="logout()">退出登录</button>`);const or=await fetch((window.API_BASE_URL||'')+'/api/orders',{headers:h}),orders=await or.json();document.querySelector('#myOrders').innerHTML=or.ok?(orders.map(x=>`<p>${x.name} · ${x.amount} 积分</p>`).join('')||'暂无订单'):(orders.error||'读取失败');if(me.role==='merchant')loadMerchantProducts()}catch(e){toast(e.message)}};
window.submitTopup=async function(){try{const r=await fetch((window.API_BASE_URL||'')+'/api/topups',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+authToken},body:JSON.stringify({points:Number(document.querySelector('#topupAmount').value)})}),d=await r.json();if(!r.ok)throw Error(d.error);toast(d.message);accountCenter()}catch(e){toast(e.message)}};
window.submitMerchantProduct=async function(){try{const r=await fetch((window.API_BASE_URL||'')+'/api/merchant/products',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+authToken},body:JSON.stringify({name:document.querySelector('#mpname').value,description:document.querySelector('#mpdesc').value,price:Number(document.querySelector('#mpprice').value),image:document.querySelector('#mpimage').value})}),d=await r.json();if(!r.ok)throw Error(d.error);toast('商品已提交审核');loadMerchantProducts()}catch(e){toast(e.message)}};
window.loadMerchantProducts=async function(){const r=await fetch((window.API_BASE_URL||'')+'/api/merchant/products',{headers:{Authorization:'Bearer '+authToken}}),d=await r.json(),el=document.querySelector('#merchantProducts');if(el)el.innerHTML=r.ok?(d.map(p=>`<p>${p.name} · ${p.status}</p>`).join('')||'暂无商品'):d.error};
window.loadApprovedProducts();
</script>
